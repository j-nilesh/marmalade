services:
  marmalade:
    # Option 1: Use prebuilt multi-arch image (fastest):
    image: ghcr.io/j-nilesh/marmalade:latest
    # Option 2: Or compile locally from source (comment out image above and uncomment build below):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: marmalade
    restart: unless-stopped
    ports:
      # Host port binding:
      # - Default: "127.0.0.1:4120:4120" (binds to localhost only; prevents unauthenticated LAN exposure)
      # - Home Wi-Fi / LAN: Set MARMALADE_BIND_IP=0.0.0.0 in .env to allow tablets/laptops on home Wi-Fi
      # - Public internet / VPS: NEVER expose raw HTTP 4120 directly. Always place behind a reverse proxy
      #   (Caddy, Nginx, Cloudflare Tunnel) terminating HTTPS, and configure SETUP_TOKEN in .env.
      - "${MARMALADE_BIND_IP:-127.0.0.1}:4120:4120"
    volumes:
      # Persistent local database volume
      - ./data:/app/data
    environment:
      - MARMALADE_PORT=4120
      - MARMALADE_HOST=0.0.0.0
      - MARMALADE_DB_PATH=/app/data/marmalade.db
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      # Commercial provider keys (optional; only needed if using these models)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_ZDR_APPROVED=${OPENAI_ZDR_APPROVED:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SEARCH_API_URL=${SEARCH_API_URL:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-${BRAVE_SEARCH_API_KEY:-}}
    extra_hosts:
      # Allows the container to access local Ollama running on the host machine
      - "host.docker.internal:host-gateway"

  # Optional private search adapter: docker compose --profile research up -d
  searxng:
    image: searxng/searxng:latest
    profiles: [research]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/searxng.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
