# render.yaml — Render Blueprint for 1-Click Cloud Deployment with Persistent SQLite Disk
services:
  - type: web
    name: marmalade-family
    runtime: docker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: MARMALADE_PORT
        value: "4120"
      - key: MARMALADE_HOST
        value: 0.0.0.0
      - key: MARMALADE_DB_PATH
        value: /app/data/marmalade.db
      # Highly recommended: Set SETUP_TOKEN to protect initial household setup on public URLs
      # - key: SETUP_TOKEN
      #   generateValue: true
    healthCheckPath: /api/bootstrap
    disk:
      name: marmalade-sqlite-data
      mountPath: /app/data
      sizeGB: 1
