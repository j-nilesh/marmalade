<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marmalade Quick Buttons</title>
  <style>
    @font-face {
      font-family: 'Fredoka';
      src: url('../../../src/client/fonts/fredoka-latin-wght-normal.woff2') format('woff2');
      font-weight: 300 700;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('../../../src/client/fonts/nunito-latin-wght-normal.woff2') format('woff2');
      font-weight: 700 800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      padding: 10px;
      display: inline-flex;
      font-family: 'Nunito', sans-serif;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      border: 2px solid transparent;
      cursor: pointer;
    }

    /* Docker button: primary brand accent */
    .btn-docker {
      background: #f2784b;
      color: #ffffff;
      border-color: #d86439;
    }
    body.dark .btn-docker {
      background: #e86427;
      border-color: #b44a22;
    }

    /* Demo button: leafy green */
    .btn-demo {
      background: #eef5f0;
      color: #1f4d3a;
      border-color: #bcd4c4;
    }
    body.dark .btn-demo {
      background: #1f3327;
      color: #79c59f;
      border-color: #2e4d3a;
    }

    /* Docs button: warm cream card */
    .btn-docs {
      background: #fff8f0;
      color: #3b2a1e;
      border-color: #e3d2b4;
    }
    body.dark .btn-docs {
      background: #252321;
      color: #e8ded6;
      border-color: #3f3933;
    }

    .icon {
      font-size: 22px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="btnContainer" class="btn btn-docker">
    <span class="icon" id="btnIcon">🐳</span>
    <span id="btnText">Run with Docker</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'docker';
    const theme = params.get('theme');

    const container = document.getElementById('btnContainer');
    const icon = document.getElementById('btnIcon');
    const text = document.getElementById('btnText');

    if (theme === 'dark') document.body.classList.add('dark');

    if (type === 'demo') {
      container.className = 'btn btn-demo';
      icon.textContent = '✨';
      text.textContent = 'Try Demo Mode';
    } else if (type === 'docs') {
      container.className = 'btn btn-docs';
      icon.textContent = '📖';
      text.textContent = 'Read the Docs';
    } else {
      container.className = 'btn btn-docker';
      icon.textContent = '🐳';
      text.textContent = 'Run with Docker';
    }
  </script>
</body>
</html>
